      - name: Test X authentication directly
        env:
          X_OAUTH_TOKEN: ${{ secrets.X_OAUTH_TOKEN }}
        run: |
          python -c 'import os,urllib.request; req=urllib.request.Request("https://api.x.com/2/users/me", headers={"Authorization":"Bearer "+os.environ["X_OAUTH_TOKEN"]}); print(urllib.request.urlopen(req).read().decode())'