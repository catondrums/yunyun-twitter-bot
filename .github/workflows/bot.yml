name: Yunyun Twitter Bot

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tweepy
        run: pip install tweepy

      - name: Test posting
        env:
          X_OAUTH_TOKEN: ${{ secrets.X_OAUTH_TOKEN }}
        run: |
          python -c 'import tweepy,os; c=tweepy.Client(os.environ["X_OAUTH_TOKEN"]); r=c.create_tweet(text="GitHub bot authentication test", user_auth=False); print("POSTED:", r.data)'